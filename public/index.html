<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault - Personal Password Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BACKGROUND DECORATIONS -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <!-- ── SETUP SCREEN ──────────────────────────────────────────────────────── -->
  <div id="setup-screen" class="auth-container hidden">
    <div class="auth-card">
      <div class="logo">
        <svg viewBox="0 0 24 24" class="logo-icon"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm0 10c-2.7 0-5.8 1.29-6 2.01V20h12v-1c-.2-.71-3.3-2-6-2z"/></svg>
        <h1>VAULT</h1>
      </div>
      <h2>First-time Setup</h2>

      
      <form id="setup-form">
        <div class="form-group">
          <label for="setup-password">Master Password</label>
          <input type="password" id="setup-password" placeholder="At least 8 characters" required minlength="8">
        </div>
        <div class="form-group">
          <label for="setup-confirm">Confirm Password</label>
          <input type="password" id="setup-confirm" placeholder="Repeat your password" required>
        </div>
        <div class="form-group">
          <label for="setup-question">Secret Security Question</label>
          <input type="text" id="setup-question" placeholder="E.g., What was the name of your first pet?" required>
        </div>
        <div class="form-group">
          <label for="setup-answer">Answer to Question</label>
          <input type="password" id="setup-answer" placeholder="Case-sensitive answer" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Initialize Vault</button>
      </form>
      <div id="setup-error" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- ── LOGIN SCREEN ──────────────────────────────────────────────────────── -->
  <div id="login-screen" class="auth-container hidden">
    <div class="auth-card">
      <div class="logo">
        <svg viewBox="0 0 24 24" class="logo-icon"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <h1>VAULT</h1>
      </div>
      <h2>Unlock Your Vault</h2>


      <form id="login-form">
        <!-- Step 1: Password -->
        <div id="login-step-1">
          <div class="form-group">
            <label for="login-password">Master Password</label>
            <input type="password" id="login-password" placeholder="Enter master password" required>
          </div>
          <button type="button" id="btn-login-next" class="btn btn-primary btn-block">Continue</button>
        </div>
        
        <!-- Step 2: Secret Question (hidden by default) -->
        <div id="login-step-2" class="hidden">
          <div class="form-group">
            <label id="security-question-label" for="login-answer">Security Question</label>
            <input type="password" id="login-answer" placeholder="Your answer">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Unlock Vault</button>
          <button type="button" id="btn-login-back" class="btn btn-secondary btn-block" style="margin-top: 10px;">Back</button>
        </div>
      </form>
      <div id="login-error" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- ── APP LAYOUT ────────────────────────────────────────────────────────── -->
  <div id="app-layout" class="app-layout hidden">
    
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg viewBox="0 0 24 24" class="logo-icon-small"><path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm0 10c-2.7 0-5.8 1.29-6 2.01V20h12v-1c-.2-.71-3.3-2-6-2z"/></svg>
        <span>Vault</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-tab="passwords">
          <svg viewBox="0 0 24 24" class="nav-icon"><path fill="currentColor" d="M12.65 11.65l2.1-2.1c.3-.3.7-.3 1 0l.7.7c.3.3.3.7 0 1l-2.1 2.1c-.2.2-.5.3-.8.3h-.9v-.9c0-.3.1-.6.3-.8zm-4.9.9l2.8-2.8c.2-.2.5-.3.8-.3h.9v.9c0 .3-.1.6-.3.8L9.05 13.9c-.3.3-.7.3-1 0l-.7-.7c-.3-.3-.3-.7 0-1zm11.75-6.3l-1.4-1.4c-.8-.8-2.1-.8-2.9 0l-1.4 1.4-4.2-4.2C8.6 1.15 7.3 1.15 6.5 1.95L2.3 6.15c-.8.8-.8 2.1 0 2.9l4.2 4.2-1.4 1.4c-.8.8-.8 2.1 0 2.9l1.4 1.4c.8.8 2.1.8 2.9 0l1.4-1.4 4.2 4.2c.8.8 2.1.8 2.9 0l4.2-4.2c.8-.8.8-2.1 0-2.9l-4.2-4.2 1.4-1.4c.8-.8.8-2.1 0-2.9zM12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          Passwords
        </a>

      </nav>

      <div class="sidebar-footer">
        <div class="sync-status">
          <span class="status-dot" title="Synced"></span>
        </div>
        <button id="btn-lock" class="btn btn-secondary btn-block">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
          Lock Vault
        </button>
      </div>
    </aside>

    <!-- MAIN VIEWS CONTAINER -->
    <main class="main-content">
      
      <!-- ── VIEW: PASSWORDS ────────────────────────────────────────────────── -->
      <section id="view-passwords" class="tab-view">
        <header class="view-header">
          <div>
            <h1>Passwords</h1>

          </div>
          <button id="btn-add-entry" class="btn btn-primary">
            <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Add New Entry
          </button>
        </header>

        <!-- SEARCH AND FILTER PANEL -->
        <div class="filter-panel">
          <div class="search-wrapper">
            <svg viewBox="0 0 24 24" class="search-icon"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-input" placeholder="Search passwords, websites, categories, or notes...">
          </div>
          
          <div class="category-selectors">
            <button class="cat-pill active" data-cat="all">All</button>
            <button class="cat-pill" data-cat="app-lock">App Locks</button>
            <button class="cat-pill" data-cat="login">Login</button>
            <button class="cat-pill" data-cat="bank">Bank</button>
            <button class="cat-pill" data-cat="wifi-other">Wi-Fi &amp; Other</button>
          </div>
        </div>

        <!-- LIST GRID -->
        <div id="entries-grid" class="entries-grid">
          <!-- Cards injected dynamically via JS -->
        </div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="empty-state hidden">
          <svg viewBox="0 0 24 24" class="empty-icon"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <h3>Your vault is empty</h3>
          <p>Get started by adding your first password or secret credential.</p>
          <button id="btn-empty-add" class="btn btn-primary">Create an Entry</button>
        </div>
      </section>

      <!-- ── VIEW: GENERATOR ────────────────────────────────────────────────── -->
      <section id="view-generator" class="tab-view hidden">
        <header class="view-header">
          <div>
            <h1>Password Generator</h1>

          </div>
        </header>

        <div class="generator-card">
          <div class="generator-display">
            <span id="gen-output" class="password-text">Generating...</span>
            <button id="btn-gen-copy" class="btn btn-icon" title="Copy Password">
              <svg viewBox="0 0 24 24" class="icon-m"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
          </div>

          <div class="strength-bar-wrapper">
            <div class="strength-label">Password Strength: <span id="strength-text" class="strength-good">Strong</span></div>
            <div class="strength-meter"><div id="strength-fill" class="strength-fill-good" style="width: 80%"></div></div>
          </div>

          <div class="generator-options">
            <div class="option-row">
              <label for="gen-length">Password Length (<span id="len-val">24</span>)</label>
              <input type="range" id="gen-length" min="6" max="64" value="24">
            </div>

            <div class="checkbox-grid">
              <label class="checkbox-container">
                <input type="checkbox" id="gen-upper" checked>
                <span class="checkmark"></span>
                Uppercase (A-Z)
              </label>

              <label class="checkbox-container">
                <input type="checkbox" id="gen-lower" checked>
                <span class="checkmark"></span>
                Lowercase (a-z)
              </label>

              <label class="checkbox-container">
                <input type="checkbox" id="gen-numbers" checked>
                <span class="checkmark"></span>
                Numbers (0-9)
              </label>

              <label class="checkbox-container">
                <input type="checkbox" id="gen-symbols" checked>
                <span class="checkmark"></span>
                Symbols (!@#$...)
              </label>
            </div>

            <div class="form-group option-custom-charset">
              <label for="gen-custom">Custom Charset (Overrides options above if filled)</label>
              <input type="text" id="gen-custom" placeholder="e.g. abcde12345!@#">
            </div>

            <button id="btn-gen-refresh" class="btn btn-primary btn-block">
              <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              Regenerate Password
            </button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ── MODAL: VIEW ENTRY DETAILS ────────────────────────────────────────── -->
  <div id="modal-view-entry" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2 id="view-title">Entry Title</h2>
          <span id="view-category-badge" class="badge">category</span>
        </div>
        <button class="btn btn-close modal-close-btn">&times;</button>
      </div>
      <!-- Dynamically populated by openViewModal() -->
      <div class="modal-body" id="view-modal-body"></div>
      <div class="modal-footer">
        <button id="btn-edit-entry-from-view" class="btn btn-secondary">Edit Entry</button>
        <button id="btn-delete-entry-from-view" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: ADD / EDIT ENTRY FORM ────────────────────────────────────── -->
  <div id="modal-edit-entry" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="form-modal-title">New Entry</h2>
        <button class="btn btn-close modal-close-btn">&times;</button>
      </div>

      <form id="entry-form">
        <input type="hidden" id="entry-id-field">
        <div class="modal-body">

          <!-- Category card selector -->
          <div class="form-group">
            <label>Category</label>
            <div class="cat-select-grid" id="cat-selector-grid"></div>
          </div>

          <!-- Dynamic fields injected by JS -->
          <div id="form-dynamic-fields"></div>



          <!-- Secret Guard toggle -->
          <div class="toggle-row">
            <label class="toggle-label" for="form-secret-guard">
              <input type="checkbox" id="form-secret-guard">
              <span class="toggle-switch"></span>
              Add Secret Question Guard
            </label>
          </div>
          <div id="form-secret-guard-fields" class="hidden">
            <div class="form-group">
              <label for="form-sq-question">Secret Question</label>
              <input type="text" id="form-sq-question" placeholder="">
            </div>
            <div class="form-group">
              <label for="form-sq-answer">Answer <span style="color:var(--text-muted);text-transform:none;font-size:0.75rem">(case-insensitive)</span></label>
              <input type="password" id="form-sq-answer" placeholder="">
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary modal-close-btn">Cancel</button>
          <button type="submit" id="btn-save-entry" class="btn btn-primary">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
